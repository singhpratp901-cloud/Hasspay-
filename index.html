.logo-box{

.info{

}

.info-item{
    padding:28px 8px;

    border-right:1px solid rgba(255,255,255,.45);
}

.info-item:last-child{

}

.label{
    display:block;

    font-size:18px;
    font-weight:700;

    margin-bottom:12px;
}

.value{

    font-weight:800;

.download{

    background:
        linear-gradient(100deg,#fff200,#ffb300);

    text-decoration:none;

    font-size:29px;
    font-weight:800;

    box-shadow:
        0 12px 35px rgba(255,190,0,.35);

    transition:.2s;
}

.download:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 45px rgba(255,190,0,.45);
}

.download:active{
    transform:scale(.98);
}

.note{
    font-size:21px;
    line-height:1.5;

    color:#fff;

    font-weight:600;

    padding:0 40px 40px;

    text-shadow:0 2px 8px rgba(0,0,0,.15);
}

.footer{
    border-top:1px solid rgba(255,255,255,.40);

    padding:28px 20px;
}

.footer a{
    color:#fff;

    text-decoration:none;

    font-size:21px;
    margin:0 18px;
}

.age{
    color:#fff;

    text-align:center;

    font-size:19px;
    line-height:1.5;

    padding:28px 20px 5px;

    text-shadow:0 2px 8px rgba(0,0,0,.20);
}

@media(max-width:600px){

    }

</html>
